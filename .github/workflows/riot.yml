name: "RIOT! — the corpus grows"
# Every three hours the crawler walks further into the archives of riots and adds what it finds to riot-corpus.json
on:
  schedule:
    - cron: "41 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: riot-crawler
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node crawler/riot.mjs 25
      - run: |
          git config user.name "riot-bot"
          git config user.email "riot-bot@users.noreply.github.com"
          git add riot-corpus.json riot-sample.json riot-state.json
          if ! git diff --cached --quiet; then
            git commit -m "RIOT!: the corpus grows"
            git pull --rebase
            git push
          fi
