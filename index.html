function shuffle(a) {

/* ---------- the montage ---------- */
const ready = []; let loading = 0, running = false;
const MAX_READY = 8, MAX_LOADING = 6;
function next() {
  if (!deck.length) deck = shuffle(pool.slice());

function fill() {
  while (pool.length && loading < MAX_LOADING && ready.length + loading < MAX_READY) {
    const it = next(); if (!it) break; load(it);

}
function load(it) {
  loading++;

  let retried = false;
  im.onload = () => {
    const done = () => { loading--; ready.push(im); if (!running) { running = true; tick(); } fill(); };

          if (kind === "c") queue.push({ c: t, f: "h", d: q.d + 1, oct: false });
          else if (kind === "a") queue.push({ c: t, f: "a", d: q.d + 1, oct: q.oct || OCTOBER.test(t) });
          else if (OCTOBER.test(t)) queue.push({ c: t, f: "a", d: q.d + 1, oct: true });

        const ii = pg.imageinfo && pg.imageinfo[0];
        if (!ii || !/image\/(jpeg|png|webp)/.test(ii.mime) || NOT_PHOTO.test(pg.title)) continue;
        if (q.f === "t" && !PROTEST.test(pg.title)) continue;
        const dto = ((ii.extmetadata && ii.extmetadata.DateTimeOriginal && ii.extmetadata.DateTimeOriginal.value) || "").replace(/<[^>]+>/g, " ");
        const october = /\d{4}/.test(dto) ? OCT_DATE.test(dto) : (q.oct || OCTOBER.test(q.c) || OCT_DATE.test(pg.title));
        if (!october) continue;
        if (add(fileItem(pg, ii))) { found++; if (++sinceSave >= 100) { save(); sinceSave = 0; } }
      }
      fill();
      cont = r.continue || null;
      await new Promise(res => setTimeout(res, 120));
    } while (cont);
  }
  return found;
}

/* ---------- go ---------- */
let cached = null;
try { cached = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
SEED.forEach(p => add(itemFromPath(p)));
if (cached && cached.p) cached.p.forEach(([k, n, u, o]) => add({ k, n, u, o }));
deck = shuffle(pool.slice());
fill();
if (!cached || Date.now() - cached.t > TTL) crawl().then(n => { if (n) save(); });
})();
